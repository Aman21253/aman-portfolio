upstream api_pool {
  least_conn;                       # send each request to the least busy replica
  server api1:4000 max_fails=2 fail_timeout=10s;
  server api2:4000 max_fails=2 fail_timeout=10s;
  server api3:4000 max_fails=2 fail_timeout=10s;
}
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=contact:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
  listen 80;
  server_tokens off;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_next_upstream error timeout http_502 http_503;
  limit_req_status 429;

  location = /api/chat {
    limit_req zone=chat burst=5 nodelay;
    proxy_read_timeout 60s;
    proxy_pass http://api_pool;
  }
  location = /api/contact {
    limit_req zone=contact burst=3 nodelay;
    proxy_pass http://api_pool;
  }
  location /api/ {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://api_pool;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
